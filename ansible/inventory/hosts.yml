---
all:
  children:
    control_plane:
      hosts:
        control-plane-1:
          k3s_cluster_init: true
          # Supply nebula_ip from a private inventory or extra vars when using
          # the optional Nebula transport.
    workers:
      hosts:
        worker-1:
        worker-2:
  vars:
    ansible_user: admin
    ansible_python_interpreter: /usr/bin/python3
    # Do not put public or mesh addresses in this example inventory. Set
    # ansible_host per host in a private inventory/host_vars file.
