---
- name: Require an external Tailscale auth key
  ansible.builtin.assert:
    that:
      - tailscale_auth_key is defined
      - (tailscale_auth_key | string | length) > 0
    fail_msg: >-
      Set tailscale_auth_key through an external secret manager or private vars
      file; it must never be committed to this repository.
  no_log: true

- name: Configure Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components:
      - main
    signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_facts.distribution | lower }}/{{ ansible_facts.distribution_release }}/noarmor.gpg"
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate Tailscale
  ansible.builtin.command: >-
    tailscale up --auth-key={{ tailscale_auth_key }} {{ tailscale_args }}
  when: tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != "Running"
  changed_when: true
  no_log: true
