name: Infrastructure Template Checks

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Node provider template to validate'
        required: true
        type: choice
        options:
          - aws
          - gcloud
          - hetzner
          - oracle
          - metal

jobs:
  validate-template:
    name: Validate ${{ inputs.provider }} template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check provider template
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          test -f "infrastructure/providers/${PROVIDER}/README.md"
          test -f "templates/nodes/${PROVIDER}/README.md"
          test -f "infrastructure/modules/k3s-node/README.md"
          test -f "infrastructure/modules/nebula-node/README.md"
          test -f "infrastructure/modules/dns/README.md"

      - name: Check required node roles are documented
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          grep -Riq "ingress" "templates/nodes/${PROVIDER}" "infrastructure/modules"
          grep -Riq "storage" "templates/nodes/${PROVIDER}" "infrastructure/modules"
          grep -REiq "runner|runners" "templates/nodes/${PROVIDER}" "infrastructure/modules"
          grep -Riq "gpu" "templates/nodes/${PROVIDER}" "infrastructure/modules"
