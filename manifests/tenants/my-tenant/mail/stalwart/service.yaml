apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: my-tenant-mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: smtp
      port: 25
      targetPort: smtp
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps
