apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  namespace: arc-runner-my-domain
spec:
  interval: 1h
  url: oci://ghcr.io/actions/actions-runner-controller-charts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-my-domain
  namespace: arc-runner-my-domain
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.13.1
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-runner-my-domain
  values:
    githubConfigUrl: https://github.com/TEMPLATE_GITHUB_ORG
    githubConfigSecret: arc-my-domain-github-secret
    runnerScaleSetName: arc-runner-my-domain
    minRunners: 0
    maxRunners: 4
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller-gha-rs-controller
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.328.0 # {"$imagepolicy": "flux-system:arc-runner"}
            command: [/home/runner/run.sh]
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 8Gi
