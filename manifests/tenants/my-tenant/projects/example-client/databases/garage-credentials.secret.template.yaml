# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
  namespace: example-client
type: Opaque
stringData:
  access-key-id: CHANGE_ME_CNPG_GARAGE_ACCESS_KEY_ID
  secret-access-key: CHANGE_ME_CNPG_GARAGE_SECRET_ACCESS_KEY
  region: garage
