apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: example-client-postgres
  namespace: example-client
  labels:
    backup.company-as-code.io/target: garage
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: example_client
      owner: example_client
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
  storage:
    storageClass: TEMPLATE_FAST_STORAGE_CLASS
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/example-client-example_client/
      endpointURL: http://garage.garage.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: garage-credentials
          key: access-key-id
        secretAccessKey:
          name: garage-credentials
          key: secret-access-key
        region:
          name: garage-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: example-client-postgres-daily
  namespace: example-client
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: example-client-postgres
  immediate: true
