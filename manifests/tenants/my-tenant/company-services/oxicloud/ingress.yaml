apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oxicloud
  namespace: my-tenant-oxicloud
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: drive.TEMPLATE_DOMAIN
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - drive.TEMPLATE_DOMAIN
      secretName: oxicloud-tls
  rules:
    - host: drive.TEMPLATE_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oxicloud
                port:
                  number: 80
