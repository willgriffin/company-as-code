apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: matomo-mariadb
  namespace: my-tenant-matomo
spec:
  rootPasswordSecretKeyRef:
    name: matomo-secrets
    key: MARIADB_ROOT_PASSWORD
  database: matomo
  username: matomo
  passwordSecretKeyRef:
    name: matomo-secrets
    key: MARIADB_PASSWORD
  replicas: 1
  storage:
    size: 20Gi
    storageClassName: TEMPLATE_FAST_STORAGE_CLASS
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  metrics:
    enabled: true
