apiVersion: batch/v1
kind: CronJob
metadata:
  name: matomo-archive-hourly
  namespace: my-tenant-matomo
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: archive
              image: matomo:5-apache
              command: [/bin/sh, -c]
              args: ["php /var/www/html/console core:archive --url=https://analytics.TEMPLATE_DOMAIN"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
