apiVersion: org.willgriffin.dev/v1alpha1
kind: Agent
metadata:
  name: example-agent
  namespace: org-example
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: company-as-code
    app.kubernetes.io/part-of: org-as-code
spec:
  # Observation is safe by default even if directoryApply is later enabled.
  activate: false
  identity:
    slug: example-agent
    email: example-agent@example.invalid
    displayName: Example Agent
    idpAccount: example-agent
    deprovisionPolicy: Retain
  contractRef:
    name: example-agent
    repository: https://example.invalid/agent-contract.git
    ref: TEMPLATE_AGENT_CONTRACT_REF
  memory:
    bankId: repo-example-example.invalid
  envPolicy: gated
