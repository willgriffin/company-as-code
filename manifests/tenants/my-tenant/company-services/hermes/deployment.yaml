apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: my-tenant-hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        backup.company-as-code.io/include: "true"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/hermes-gateway:0.1.0 # {"$imagepolicy": "flux-system:hermes-gateway"}
          args: [gateway, run]
          envFrom:
            - secretRef:
                name: hermes-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: agent-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
        - name: workspace
          image: ghcr.io/example/hermes-workspace:0.1.0 # {"$imagepolicy": "flux-system:hermes-workspace"}
          ports:
            - name: workspace
              containerPort: 3000
          volumeMounts:
            - name: workspace-files
              mountPath: /workspace
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: workspace-files
          persistentVolumeClaim:
            claimName: hermes-workspace-files
