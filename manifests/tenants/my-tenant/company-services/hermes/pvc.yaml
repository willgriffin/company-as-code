apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: my-tenant-hermes
  labels:
    backup.company-as-code.io/include: "true"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: TEMPLATE_FAST_STORAGE_CLASS
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-workspace-files
  namespace: my-tenant-hermes
  labels:
    backup.company-as-code.io/include: "true"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: TEMPLATE_BULK_STORAGE_CLASS
  resources:
    requests:
      storage: 100Gi
