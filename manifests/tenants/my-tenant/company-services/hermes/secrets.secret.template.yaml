# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-runtime-secrets
  namespace: org-example
  labels:
    # Required by the operator's narrow Secret informer.
    org.willgriffin.dev/managed-secret: "true"
type: Opaque
stringData:
  HERMES_API_KEY: CHANGE_ME
