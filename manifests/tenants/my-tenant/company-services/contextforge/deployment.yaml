apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextforge
  namespace: my-tenant-contextforge
  labels:
    app.kubernetes.io/name: contextforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: contextforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contextforge
        app.kubernetes.io/part-of: company-services
    spec:
      containers:
        - name: contextforge
          image: ghcr.io/ibm/mcp-context-forge:v1.0.0 # {"$imagepolicy": "flux-system:contextforge"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4444
          env:
            - name: PUBLIC_URL
              value: https://context.TEMPLATE_DOMAIN
            - name: DATABASE_HOST
              value: contextforge-postgres-rw.my-tenant-contextforge.svc.cluster.local
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
