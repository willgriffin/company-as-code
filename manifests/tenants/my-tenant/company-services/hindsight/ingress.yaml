apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight
  namespace: my-tenant-hindsight
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: hindsight.TEMPLATE_DOMAIN
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hindsight.TEMPLATE_DOMAIN
      secretName: hindsight-tls
  rules:
    - host: hindsight.TEMPLATE_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hindsight
                port:
                  number: 80
