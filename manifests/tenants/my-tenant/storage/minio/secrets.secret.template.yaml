# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root-credentials
  namespace: my-tenant-storage
type: Opaque
stringData:
  config.env: |
    export MINIO_ROOT_USER=CHANGE_ME
    export MINIO_ROOT_PASSWORD=CHANGE_ME
---

# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: minio-backup-credentials
  namespace: my-tenant-storage
type: Opaque
stringData:
  GARAGE_ACCESS_KEY_ID: CHANGE_ME
  GARAGE_SECRET_ACCESS_KEY: CHANGE_ME
