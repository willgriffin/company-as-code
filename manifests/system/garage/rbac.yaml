apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: garage-kubernetes-discovery
rules:
  - apiGroups: [deuxfleurs.fr]
    resources: [garagenodes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: garage-kubernetes-discovery
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: garage
roleRef:
  kind: ClusterRole
  name: garage-kubernetes-discovery
  apiGroup: rbac.authorization.k8s.io
