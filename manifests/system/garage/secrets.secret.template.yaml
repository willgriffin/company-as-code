# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: garage
type: Opaque
stringData:
  rpc_secret: CHANGE_ME_32_BYTE_HEX
  admin_token: CHANGE_ME_ADMIN_TOKEN
---

# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
