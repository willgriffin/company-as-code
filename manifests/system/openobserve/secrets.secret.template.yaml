# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: openobserve-secret
  namespace: openobserve
type: Opaque
stringData:
  ZO_ROOT_USER_EMAIL: admin@TEMPLATE_DOMAIN
  ZO_ROOT_USER_PASSWORD: CHANGE_ME_OPENOBSERVE_PASSWORD
  ZO_ROOT_USER_TOKEN: CHANGE_ME_OPENOBSERVE_TOKEN
  ZO_S3_ACCESS_KEY: CHANGE_ME_MINIO_OPENOBSERVE_ACCESS_KEY
  ZO_S3_SECRET_KEY: CHANGE_ME_MINIO_OPENOBSERVE_SECRET_KEY
  ZO_META_POSTGRES_DSN: postgres://openobserve:CHANGE_ME@openobserve-postgres-rw.openobserve.svc.cluster.local:5432/app
  OPENFGA_DATASTORE_URI: postgres://openobserve:CHANGE_ME@openobserve-postgres-rw.openobserve.svc.cluster.local:5432/app
  ZO_TRACING_HEADER_KEY: Authorization
  ZO_TRACING_HEADER_VALUE: Basic CHANGE_ME
