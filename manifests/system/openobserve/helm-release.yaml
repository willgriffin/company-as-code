apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openobserve
  namespace: openobserve
spec:
  interval: 1h
  url: https://charts.openobserve.ai
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve
  namespace: openobserve
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: openobserve
      version: 0.80.3
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: openobserve
  values:
    externalSecret:
      enabled: true
      name: openobserve-secret
    replicaCount:
      ingester: 1
      querier: 1
      router: 1
      compactor: 1
      alertmanager: 0
      o2ai: 0
    config:
      ZO_CLUSTER_NAME: my-cluster
      ZO_LOCAL_MODE: "false"
      ZO_META_STORE: postgres
      ZO_S3_PROVIDER: minio
      ZO_S3_SERVER_URL: http://minio.my-tenant-storage.svc.cluster.local:80
      ZO_S3_REGION_NAME: us-east-1
      ZO_S3_BUCKET_NAME: openobserve
      ZO_S3_FEATURE_FORCE_HOSTED_STYLE: "true"
      ZO_USAGE_REPORTING_ENABLED: "false"
    minio:
      enabled: false
    postgres:
      enabled: true
      spec:
        instances: 1
        storage:
          size: 20Gi
          storageClass: TEMPLATE_FAST_STORAGE_CLASS
    nats:
      enabled: true
    ingress:
      enabled: false
    resources:
      ingester:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 3Gi
      querier:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      router:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      compactor:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
