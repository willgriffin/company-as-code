# Signed v0.1.2 OCI chart. Keep the URL, digest, and Cosign identity together.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: org-as-code-chart
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: org-as-code
spec:
  interval: 1h
  suspend: false
  url: oci://ghcr.io/willgriffin/charts/org-as-code
  ref:
    digest: sha256:03932fdb6468f8f26ef58867ec3a7b5887dcfe4e6da22c7e950630accf8d6813
  secretRef:
    name: org-as-code-registry
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/willgriffin/org-as-code/\.github/workflows/release\.yaml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
