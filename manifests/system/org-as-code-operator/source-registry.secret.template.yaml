# Copy to source-registry.secret.enc.yaml, replace placeholders, encrypt with
# SOPS, and add the encrypted filename to kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: org-as-code-registry
  namespace: flux-system
type: Opaque
stringData:
  username: TEMPLATE_GHCR_USERNAME
  password: TEMPLATE_GHCR_TOKEN
