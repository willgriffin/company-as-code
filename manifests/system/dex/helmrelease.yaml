apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: dex
spec:
  interval: 1h
  url: https://charts.dexidp.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  interval: 30m
  chart:
    spec:
      chart: dex
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: dex
  valuesFrom:
    - kind: Secret
      name: dex-connectors
      valuesKey: KANIDM_CLIENT_SECRET
      targetPath: config.connectors[0].config.clientSecret
    - kind: Secret
      name: dex-connectors
      valuesKey: FORGEJO_CLIENT_SECRET
      targetPath: config.staticClients[0].secret
    - kind: Secret
      name: dex-connectors
      valuesKey: VAULTWARDEN_CLIENT_SECRET
      targetPath: config.staticClients[1].secret
    - kind: Secret
      name: dex-connectors
      valuesKey: STALWART_CLIENT_SECRET
      targetPath: config.staticClients[2].secret
    - kind: Secret
      name: dex-connectors
      valuesKey: MATOMO_CLIENT_SECRET
      targetPath: config.staticClients[3].secret
    - kind: Secret
      name: dex-connectors
      valuesKey: CONTEXTFORGE_CLIENT_SECRET
      targetPath: config.staticClients[4].secret
    - kind: Secret
      name: dex-connectors
      valuesKey: VIKUNJA_CLIENT_SECRET
      targetPath: config.staticClients[5].secret
    - kind: Secret
      name: dex-connectors
      valuesKey: ZULIP_CLIENT_SECRET
      targetPath: config.staticClients[6].secret
  values:
    replicaCount: 1
    config:
      issuer: https://auth.TEMPLATE_DOMAIN
      storage:
        type: kubernetes
        config:
          inCluster: true
      web:
        http: 0.0.0.0:5556
      connectors:
        - type: oidc
          id: kanidm
          name: Company Identity
          config:
            issuer: https://idp.TEMPLATE_DOMAIN/oauth2/openid/dex
            clientID: dex
            clientSecret: ""
            redirectURI: https://auth.TEMPLATE_DOMAIN/callback
            scopes: [openid, email, profile, groups]
            userNameKey: preferred_username
            insecureSkipEmailVerified: true
      oauth2:
        skipApprovalScreen: true
        responseTypes: [code, token, id_token]
      staticClients:
        - id: forgejo
          name: Forgejo
          secret: ""
          redirectURIs: ["https://git.TEMPLATE_DOMAIN/user/oauth2/company/callback"]
        - id: vaultwarden
          name: Vaultwarden
          secret: ""
          redirectURIs: ["https://warden.TEMPLATE_DOMAIN/identity/connect/oidc-signin"]
        - id: stalwart
          name: Stalwart
          secret: ""
          redirectURIs: ["https://mail.TEMPLATE_DOMAIN/authorize/code"]
        - id: matomo
          name: Matomo
          secret: ""
          redirectURIs: ["https://analytics.TEMPLATE_DOMAIN/index.php?module=LoginOIDC&action=callback&provider=oidc"]
        - id: contextforge
          name: ContextForge
          secret: ""
          redirectURIs: ["https://context.TEMPLATE_DOMAIN/auth/sso/callback/company"]
        - id: vikunja
          name: Vikunja
          secret: ""
          redirectURIs: ["https://todo.TEMPLATE_DOMAIN/auth/openid/company"]
        - id: zulip
          name: Zulip
          secret: ""
          redirectURIs: ["https://chat.TEMPLATE_DOMAIN/complete/oidc/"]
      enablePasswordDB: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
