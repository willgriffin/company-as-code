# Copy to operator-oauth.secret.enc.yaml, replace placeholders, then encrypt
# with SOPS before adding the encrypted file to the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
type: Opaque
stringData:
  client_id: CHANGE_ME_TAILSCALE_CLIENT_ID
  client_secret: CHANGE_ME_TAILSCALE_CLIENT_SECRET
