# AMD GPU Device Plugin exposes AMD GPUs as amd.com/gpu resources.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin-daemonset
  namespace: kube-system
  labels:
    app: amdgpu-device-plugin
spec:
  selector:
    matchLabels:
      name: amdgpu-dp-ds
  template:
    metadata:
      labels:
        name: amdgpu-dp-ds
    spec:
      nodeSelector:
        gpu-amd: "true"
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: amdgpu-dp-cntr
          image: rocm/k8s-device-plugin@sha256:025f0c1d560cbe1bf3c08408ae42ef94dd6ed522e87e290cd60128cd20dba116
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dp
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
      volumes:
        - name: dp
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
