# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: garage-archive-sync-credentials
  namespace: garage-archive-sync
type: Opaque
stringData:
  GARAGE_ACCESS_KEY_ID: CHANGE_ME_ARCHIVE_GARAGE_ACCESS_KEY_ID
  GARAGE_SECRET_ACCESS_KEY: CHANGE_ME_ARCHIVE_GARAGE_SECRET_ACCESS_KEY
  EXTERNAL_S3_ACCESS_KEY_ID: CHANGE_ME_EXTERNAL_ACCESS_KEY_ID
  EXTERNAL_S3_SECRET_ACCESS_KEY: CHANGE_ME_EXTERNAL_SECRET_ACCESS_KEY
  EXTERNAL_S3_ENDPOINT: https://s3.TEMPLATE_EXTERNAL_BACKUP_REGION.amazonaws.com
  EXTERNAL_S3_REGION: TEMPLATE_EXTERNAL_BACKUP_REGION
  EXTERNAL_S3_BUCKET: TEMPLATE_EXTERNAL_BACKUP_BUCKET
  EXTERNAL_S3_PREFIX: garage-archive
  EXTERNAL_S3_FORCE_PATH_STYLE: "false"
