# Copy to secrets.secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: velero-credentials
  namespace: velero
type: Opaque
stringData:
  garage: |
    [default]
    aws_access_key_id=CHANGE_ME_VELERO_GARAGE_ACCESS_KEY_ID
    aws_secret_access_key=CHANGE_ME_VELERO_GARAGE_SECRET_ACCESS_KEY
  external-s3: |
    [default]
    aws_access_key_id=CHANGE_ME_EXTERNAL_S3_ACCESS_KEY_ID
    aws_secret_access_key=CHANGE_ME_EXTERNAL_S3_SECRET_ACCESS_KEY
