---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: bifrost
  namespace: flux-system
spec:
  image: maximhq/bifrost
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: bifrost
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: bifrost
  policy:
    semver:
      range: ">=0.0.0"

