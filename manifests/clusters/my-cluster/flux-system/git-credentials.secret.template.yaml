# Copy to .secret.enc.yaml, replace placeholders, then encrypt with SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: flux-system
  namespace: flux-system
type: Opaque
stringData:
  identity: CHANGE_ME_PRIVATE_DEPLOY_KEY
  identity.pub: CHANGE_ME_PUBLIC_DEPLOY_KEY
  known_hosts: CHANGE_ME_KNOWN_HOSTS
