apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matomo
  namespace: matomo
  labels:
    app.kubernetes.io/name: matomo
    app.kubernetes.io/part-of: company-services
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: matomo.example.invalid
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - matomo.example.invalid
      secretName: matomo-tls
  rules:
    - host: matomo.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: matomo
                port:
                  number: 80
